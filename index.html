<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Sovereignty Interactive Showcase</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(22, 30, 46, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --chip-bg: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-color) 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .showcase-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            max-width: 1080px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(59, 130, 246, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Video Area */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Overlay Play Button on Video */
        .video-overlay-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.9;
            border: none;
            z-index: 5;
        }

        .video-overlay-play:hover {
            transform: translate(-50%, -50%) scale(1.05);
            background: var(--primary);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
        }

        .video-wrapper.is-playing .video-overlay-play {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.7);
        }

        /* Custom Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            position: relative;
            transition: height 0.2s ease;
        }

        .progress-bar-container:hover {
            height: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 0 4px 4px 0;
            transition: width 0.1s linear;
        }

        /* Content & Controls */
        .showcase-body {
            padding: 32px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: var(--chip-bg);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .showcase-title {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .showcase-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .controls-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-speed {
            position: relative;
        }

        .time-display {
            font-size: 0.9rem;
            font-family: monospace;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Chapters/Topics Accordion Section */
        .interactive-section {
            margin-top: 28px;
        }

        .accordion-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 12px 12px;
            margin-top: -4px;
            border: 1px solid transparent;
        }

        .accordion-content.is-open {
            max-height: 250px;
            padding: 16px;
            border-color: var(--border-color);
        }

        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .chapter-chip {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .chapter-chip:hover {
            background: var(--chip-bg);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.4);
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @media (max-width: 640px) {
            .showcase-body {
                padding: 20px;
            }
            .showcase-title {
                font-size: 1.35rem;
            }
            .controls-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .button-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .time-display {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="showcase-card">
        <!-- Video Container -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="showcaseVideo" preload="metadata" muted playsinline>
                <source src="Julian_Christine_Final.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <button class="video-overlay-play" id="overlayPlayBtn" onclick="togglePlay()" aria-label="Play Video">
                <svg class="icon" style="width: 32px; height: 32px;" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
        </div>

        <!-- Custom Interactive Progress Bar -->
        <div class="progress-bar-container" id="progressBar" onclick="seekVideo(event)">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <!-- Content & Controls -->
        <div class="showcase-body">
            <span class="badge">Interactive Presentation</span>
            <h1 class="showcase-title">How Does My Digital Life Produce, Consume, and Redistribute Value, and for Whom?</h1>
            <p class="showcase-subtitle">An Analytical Framework Synthesizing Digital Labor, Platform Enshittification, Cloud Feudalism, AI Value Capture, and Protocol Sovereignty.</p>

            <div class="controls-toolbar">
                <div class="button-group">
                    <button class="btn btn-primary" onclick="togglePlay()">
                        <svg class="icon" id="playIcon" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <span id="playBtnText">Play Presentation</span>
                    </button>

                    <button class="btn btn-secondary" onclick="toggleMute()">
                        <svg class="icon" id="muteIcon" viewBox="0 0 24 24">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                        <span id="muteBtnText">Unmute</span>
                    </button>

                    <button class="btn btn-secondary btn-speed" onclick="cycleSpeed()">
                        ⚡ <span id="speedText">1.0x Speed</span>
                    </button>

                    <button class="btn btn-secondary" onclick="restartVideo()">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                        </svg>
                    </button>
                </div>

                <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
            </div>

            <!-- Chapter Navigation Accordion -->
            <div class="interactive-section">
                <button class="accordion-header" onclick="toggleAccordion()">
                    <span>📍 Jump to Presentation Chapters</span>
                    <span id="accordionArrow">▼</span>
                </button>
                <div class="accordion-content" id="accordionContent">
                    <div class="chapters-grid">
                        <button class="chapter-chip" onclick="jumpToTime(0)">01. Thesis & Intro</button>
                        <button class="chapter-chip" onclick="jumpToTime(120)">02. Unpaid Labor</button>
                        <button class="chapter-chip" onclick="jumpToTime(240)">03. Behavioral Surplus</button>
                        <button class="chapter-chip" onclick="jumpToTime(360)">04. Platform Enshittification</button>
                        <button class="chapter-chip" onclick="jumpToTime(480)">05. Cloud Feudalism</button>
                        <button class="chapter-chip" onclick="jumpToTime(600)">06. Protocol Sovereignty</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('showcaseVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const playBtnText = document.getElementById('playBtnText');
        const playIcon = document.getElementById('playIcon');
        const muteBtnText = document.getElementById('muteBtnText');
        const muteIcon = document.getElementById('muteIcon');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const speedText = document.getElementById('speedText');
        const accordionContent = document.getElementById('accordionContent');
        const accordionArrow = document.getElementById('accordionArrow');

        const speeds = [1.0, 1.25, 1.5, 2.0];
        let currentSpeedIdx = 0;

        const playSvg = '<path d="M8 5v14l11-7z"/>';
        const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        const mutedSvg = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        const unmutedSvg = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';

        function togglePlay() {
            if (video.paused || video.ended) {
                video.play();
            } else {
                video.pause();
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            updateMuteState();
        }

        function updateMuteState() {
            if (video.muted) {
                muteBtnText.textContent = 'Unmute';
                muteIcon.innerHTML = mutedSvg;
            } else {
                muteBtnText.textContent = 'Mute';
                muteIcon.innerHTML = unmutedSvg;
            }
        }

        function restartVideo() {
            video.currentTime = 0;
            video.play();
        }

        function cycleSpeed() {
            currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
            const newSpeed = speeds[currentSpeedIdx];
            video.playbackRate = newSpeed;
            speedText.textContent = `${newSpeed.toFixed(2)}x Speed`;
        }

        function seekVideo(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        function jumpToTime(seconds) {
            video.currentTime = seconds;
            if (video.paused) video.play();
        }

        function toggleAccordion() {
            accordionContent.classList.toggle('is-open');
            accordionArrow.textContent = accordionContent.classList.contains('is-open') ? '▲' : '▼';
        }

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        video.addEventListener('timeupdate', () => {
            const pct = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${pct}%`;
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        video.addEventListener('play', () => {
            playBtnText.textContent = 'Pause';
            playIcon.innerHTML = pauseSvg;
            videoWrapper.classList.add('is-playing');
        });

        video.addEventListener('pause', () => {
            playBtnText.textContent = 'Play Presentation';
            playIcon.innerHTML = playSvg;
            videoWrapper.classList.remove('is-playing');
        });

        video.addEventListener('ended', () => {
            playBtnText.textContent = 'Replay';
            playIcon.innerHTML = playSvg;
            videoWrapper.classList.remove('is-playing');
        });

        video.addEventListener('loadedmetadata', () => {
            timeDisplay.textContent = `00:00 / ${formatTime(video.duration)}`;
        });
    </script>
</body>
</html>
