<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost in the Machine: Value, AI, and Creative Labor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="documentary-container" id="docContainer">
        
        <div class="visual-viewport">
            <div class="ken-burns-wrapper" id="kenBurnsWrapper">
                <img id="bgVisual" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop" alt="Abstract AI Neural Network Art">
            </div>
            <div class="vignette-overlay"></div>
            <div class="grid-overlay"></div>
            <div class="scanline"></div>
        </div>

        <div class="text-viewport">
            <div class="chapter-badge" id="chapterBadge">CHAPTER 1 // INTRODUCTION</div>
            
            <div class="title-card-container" id="titleCard">
                <h1 class="main-title" id="mainTitle">GHOST IN THE MACHINE</h1>
                <h2 class="sub-title" id="subTitle">How Generative AI Produces, Consumes, and Redistributes Value</h2>
            </div>

            <div class="narrative-box" id="narrativeBox">
                <p class="narrative-text" id="narrativeText">Click PLAY to begin the 5-minute visual mini-documentary.</p>
            </div>

            <div class="stat-callout" id="statCallout">
                <span class="stat-number" id="statNumber">5.8B+</span>
                <span class="stat-label" id="statLabel">Images scraped without artist consent in LAION-5B training datasets.</span>
            </div>
        </div>

        <div class="audio-visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="controls-layer">
            <div class="timeline-bar-container" id="timelineContainer">
                <div class="timeline-progress" id="timelineProgress"></div>
                <div class="chapter-marker" style="left: 0%;"></div>
                <div class="chapter-marker" style="left: 20%;"></div>
                <div class="chapter-marker" style="left: 40%;"></div>
                <div class="chapter-marker" style="left: 60%;"></div>
                <div class="chapter-marker" style="left: 80%;"></div>
            </div>

            <div class="control-buttons">
                <button id="playBtn" class="btn">PLAY</button>
                <button id="restartBtn" class="btn secondary">RESTART</button>
                <div class="time-display">
                    <span id="currentTime">00:00</span> / <span id="totalTime">05:00</span>
                </div>
            </div>

            <div class="chapter-nav">
                <button class="chap-btn" data-time="0">Ch 1: Extraction</button>
                <button class="chap-btn" data-time="60">Ch 2: Scraping</button>
                <button class="chap-btn" data-time="120">Ch 3: Disruption</button>
                <button class="chap-btn" data-time="180">Ch 4: Ghost Labor</button>
                <button class="chap-btn" data-time="240">Ch 5: Synthesis</button>
            </div>
        </div>

    </div>

    <audio id="bgAudio" loop crossorigin="anonymous">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-atmospheric-112704.mp3" type="audio/mpeg">
    </audio>

    <script src="main.js"></script>
</body>
</html>
