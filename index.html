<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generative AI & Creative Labor Showcase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Showcase Card Container */
    .showcase-card {
      background: #1e1e2e;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .showcase-card h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .showcase-card p {
      color: #a0a0b0;
      margin-bottom: 25px;
    }

    /* Trigger Button */
    .open-btn {
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .open-btn:hover {
      background-color: #4f46e5;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal Content Box */
    .modal-content {
      background: #000;
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    /* Responsive Video Wrapper */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Close Button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .close-btn:hover {
      color: #ff4d4d;
    }
  </style>
</head>
<body>

  <!-- Main Showcase Container -->
  <div class="showcase-card">
    <h1>Generative AI & Creative Labor</h1>
    <p>By Christine Julian</p>
    <button class="open-btn" id="openModal">Watch Presentation</button>
  </div>

  <!-- Video Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="video-container">
        <!-- Video configured with exact file name and encoded spaces -->
        <video id="presentationVideo" controls playsinline>
          <source src="Julian%20_Christine-Final.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const video = document.getElementById('presentationVideo');

    // Open modal and attempt to play video
    openBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
      
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch((error) => {
          console.log("Autoplay prevented or video failed to play:", error);
        });
      }
    });

    // Function to close modal and reset video
    function closeModal() {
      modalOverlay.classList.remove('active');
      video.pause();
      video.currentTime = 0; // Reset video to start
    }

    closeBtn.addEventListener('click', closeModal);

    // Close when clicking outside video frame
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });
  </script>

</body>
</html>
